[package]
name = "biomiya"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Core compiler for biomiya and rv64-core-v1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "biomiya"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
